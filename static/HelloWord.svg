<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 520 50'
    style='background-color: #00000000;'
    width='520px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='6250ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h520 ; m0,25 h520 ; m0,25 h0' keyTimes='0;0.64;0.84;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#36BCF7' font-size='27'
        dominant-baseline='auto'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            (&quot;Hello, World&quot;)
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6250ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h520 ; m0,25 h520 ; m0,25 h0' keyTimes='0;0.64;0.84;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#36BCF7' font-size='27'
        dominant-baseline='auto'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            原来浮生万物里,所有的重逢都不如相遇!
        </textPath>
    </text>
</svg>
